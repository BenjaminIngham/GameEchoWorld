<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Policy Notice</title>

<style>
  /* =====================================================
     DESIGN TOKENS
     ===================================================== */
  :root {
    --bg-black: #05070D;
    --card-bg: #131B2E;
    --card-border: rgba(255, 255, 255, 0.04);

    --white: #FFFFFF;
    --text-muted: #9CA8BC;

    --gold: #D8A94E;
    --grad-start: #5B6CFA;
    --grad-end: #8B5CF6;

    --close-bg: #1B2438;
    --close-border: #2E3A52;

    --radius-card: 24px;
    --radius-btn: 12px;
  }

  * { box-sizing: border-box; }

  /* Lock the page completely — no scrolling in any direction. */
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-black);
  }

  a { text-decoration: none; }

  /* =====================================================
     HERO BACKGROUND
     Full-screen, responsive, slightly blurred hero.png
     sits behind everything else on the page.
     ===================================================== */

  /* ===============================================================
     HERO IMAGE:
     This path is relative to index.html, so the whole popup
     folder can be placed at any path on your site (/go, /popup,
     nested folders, etc.) and it will still resolve correctly.
     Place your image here (relative to this file):
     image/hero.jpg
     =============================================================== */
  .hero-bg {
    position: fixed;
    inset: 0;
    z-index: 1;
    background-color: var(--bg-black); /* fallback tone until hero.jpg is added */
    background-image: url("image/hero.jpg");
    /* background-size: cover fills the entire screen edge-to-edge with
       no empty bars on any side. Combined with the top-anchored position
       below, this means only the excess beyond the viewport (typically
       the bottom of the image) gets trimmed — the header stays visible. */
    background-size: cover;
    /* Anchored to the top (not center) so the header/top portion of the
       image sits flush against the top of the screen and stays clearly
       visible. */
    background-position: center top;
    background-repeat: no-repeat;
    filter: blur(2px);
    transform: scale(1.03); /* prevents the blurred edge from showing */
    transform-origin: center top; /* scale grows from the top edge, not the
      center, so the header is never pulled off-screen — this is what was
      cropping the header out on mobile, where cover leaves no vertical
      slack to absorb a center-anchored scale */
  }

  /* Dark overlay so the card stays readable against the photo. */
  .hero-overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    background: rgba(0, 0, 0, 0.55);
  }

  /* =====================================================
     MODAL OVERLAY (positions the card, sits above the image)
     ===================================================== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    animation: overlayFadeIn 0.35s ease forwards;
  }

  .modal-overlay.hidden {
    display: none;
  }

  @keyframes overlayFadeIn {
    to { opacity: 1; }
  }

  /* =====================================================
     POPUP CARD
     ===================================================== */
  .modal {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    width: 100%;
    max-width: 600px;
    max-height: calc(100dvh - 40px);
    overflow-y: auto;
    border-radius: var(--radius-card);
    padding: 48px 50px;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
    transform: translateY(14px) scale(0.98);
    opacity: 0;
    animation: modalRiseIn 0.4s ease 0.05s forwards;
  }

  @keyframes modalRiseIn {
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .modal h2 {
    margin: 0;
    font-family: Georgia, "Times New Roman", Times, serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 4vw, 2.3rem);
    color: var(--white);
  }

  .modal p {
    margin: 22px 0 0;
    max-width: 480px;
    color: var(--text-muted);
    font-size: 1.05rem;
    line-height: 1.65;
  }

  .modal-actions {
    margin-top: 34px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .modal-actions .btn {
    display: inline-block;
    padding: 16px 32px;
    border-radius: var(--radius-btn);
    font-weight: 700;
    font-size: 1rem;
    color: var(--white);
    transition: transform 0.15s ease, filter 0.2s ease;
  }

  .modal-actions .accept-btn {
    background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
    border: 2px solid var(--gold);
  }
  .modal-actions .accept-btn:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  .modal-actions .close-btn {
    background: var(--close-bg);
    border: 1px solid var(--close-border);
  }
  .modal-actions .close-btn:hover {
    background: #212C45;
  }

  /* =====================================================
     RESPONSIVE
     ===================================================== */
  @media (max-width: 480px) {
    .modal { padding: 36px 26px; }
    .modal-actions { flex-direction: column; }
    .modal-actions .btn { width: 100%; text-align: center; }
    /* On narrow screens, cover crops the sides heavily. Anchor to the
       left so the left edge of the image stays fully visible, letting
       any excess get trimmed off the right instead of both sides. The
       scale transform's origin also moves to the left so it doesn't
       shave off any of that same left edge. */
    .hero-bg { background-position: left top; transform-origin: left top; }
  }

  /* Respect reduced motion preferences */
  @media (prefers-reduced-motion: reduce) {
    .modal, .modal-overlay { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

  <!-- =====================================================
       HERO BACKGROUND (full-screen, blurred image only)
       ===================================================== -->
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <!-- =====================================================
       POLICY NOTICE POPUP (dark style)
       Appears automatically on page load, centered above
       the dark overlay. Informational only — closing it
       does not block access to anything behind it.
       ===================================================== -->
  <div class="modal-overlay" id="policyOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="policyTitle">
      <h2 id="policyTitle">Policy Notice</h2>
      <p>Are you accepting our policy to continue? This notice is informational and does not block access.</p>

      <!-- Both buttons below automatically use UNIVERSAL_LINK,
           set once at the top of the <script> further down this file. -->
      <div class="modal-actions">
        <a href="#" class="btn accept-btn universal-link">Yes, Accept</a>
        <a href="#" class="btn close-btn universal-link" id="closeBtn">Close</a>
      </div>
    </div>
  </div>

  <script>
    // =====================================================
    // UNIVERSAL LINK — set your destination URL ONCE here.
    // "Yes, Accept", "Close", the entire popup card, and the
    // blurred background outside the card all use this same link.
    // =====================================================
    var UNIVERSAL_LINK = "https://funspinclub.site/no-play/?2zvtxjmc";

    document.querySelectorAll('.universal-link').forEach(function (el) {
      el.href = UNIVERSAL_LINK;
    });

    var modalCard = document.querySelector('.modal');
    modalCard.addEventListener('click', function (e) {
      if (e.target.closest('a, button')) return; // let links/buttons handle their own click
      window.location.href = UNIVERSAL_LINK;
    });

    // Popup is shown automatically on load (see markup above). Pressing
    // Escape still dismisses it without navigating away. Clicking the
    // blurred background outside the card now navigates to UNIVERSAL_LINK,
    // same as the buttons.
    var policyOverlay = document.getElementById('policyOverlay');

    function dismissModal() {
      policyOverlay.classList.add('hidden');
    }

    policyOverlay.addEventListener('click', function (e) {
      if (e.target === policyOverlay) window.location.href = UNIVERSAL_LINK;
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') dismissModal();
    });
  </script>

</body>
</html>
